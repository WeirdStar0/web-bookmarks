<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Bookmarks</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-logo">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                </svg>
                <span data-i18n="extName">Bookmarks</span>
            </div>
            <div class="header-actions">
                <button id="settingsBtn" class="btn-icon" data-i18n-title="settings" data-i18n-aria-label="settings" aria-label="设置" title="设置">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </button>
                <button id="themeToggleBtn" class="btn-icon" data-i18n-title="toggleTheme" data-i18n-aria-label="toggleTheme" aria-label="切换主题" title="切换主题">
                    <svg class="w-5 h-5 theme-sun hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z">
                        </path>
                    </svg>
                    <svg class="w-5 h-5 theme-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                        </path>
                    </svg>
                </button>
                <button id="logoutBtn" class="btn-icon btn-logout hidden" data-i18n-title="logout" data-i18n-aria-label="logout" aria-label="退出" title="退出">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Settings View -->
        <div id="settingsView" class="view-container hidden">
            <h2 style="font-size: 18px; margin-bottom: 20px; font-weight: 700;" data-i18n="extensionSettings">扩展设置</h2>
            <form id="settingsForm" class="space-y-3">
                <div class="form-group">
<label class="label" for="serverUrl" data-i18n="serverUrl">服务器地址</label>
                    <input type="url" id="serverUrl" placeholder="https://your-worker.workers.dev" autocomplete="url" required aria-describedby="serverUrlDesc">
                    <p id="serverUrlDesc" style="font-size: 11px; color: var(--text-dim); margin-top: 6px;" data-i18n="serverUrlDesc">请输入您的
                        Cloudflare Worker 部署地址
                    </p>
                </div>
                <div class="form-group">
                    <label class="label" data-i18n="extensionOrigin">扩展 Origin</label>
                    <div class="origin-pairing-row">
                        <code id="extensionOrigin" class="origin-value" aria-live="polite"></code>
                        <button id="copyExtensionOriginBtn" type="button" class="btn-secondary" data-i18n="copyExtensionOrigin">复制</button>
                    </div>
                    <p class="origin-pairing-help" data-i18n="extensionOriginDesc">将此 Origin 加入 Worker 的 ALLOWED_EXTENSION_ORIGINS 后重新部署，才能安全连接当前安装的扩展。</p>
                    <div id="extensionOriginMessage" class="status-msg hidden" role="status" aria-live="polite"></div>
                </div>
                <div class="form-group">
                    <label class="label" for="langSelect" data-i18n="language">Language</label>
                    <select id="langSelect"
                        class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
                        style="margin-top: 4px;">
                        <option value="zh_CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="zh_TW">繁體中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="ru">Русский</option>
                        <option value="pt">Português</option>
                        <option value="it">Italiano</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" data-i18n="saveConfig">保存配置</button>
                <button type="button" id="cancelSettingsBtn" class="btn-secondary" data-i18n="cancel">取消</button>
            </form>
        </div>

        <!-- Login View -->
        <div id="loginView" class="view-container hidden"
            style="display: flex; flex-direction: column; justify-content: center; height: 100%;">
            <div style="text-align: center; margin-bottom: 24px;">
                <div
                    style="width: 56px; height: 56px; background: var(--primary-light); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--primary);">
                    <svg style="width: 28px; height: 28px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <h2 style="font-size: 18px; font-weight: 700;" data-i18n="welcomeBack">欢迎回来</h2>
                <p style="font-size: 13px; color: var(--text-dim); margin-top: 4px;" data-i18n="loginDesc">请登录您的书签账号</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="sr-only" for="username" data-i18n="usernamePlaceholder">用户名</label>
                    <input type="text" id="username" placeholder="用户名" data-i18n-placeholder="usernamePlaceholder"
                        autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="sr-only" for="password" data-i18n="passwordPlaceholder">密码</label>
                    <input type="password" id="password" placeholder="密码" data-i18n-placeholder="passwordPlaceholder"
                        autocomplete="current-password" required>
                </div>
                <div id="loginError" class="status-msg status-error hidden" role="alert" aria-live="assertive"></div>
                <button type="submit" class="btn-primary" style="margin-top: 8px;" data-i18n="loginBtn">立即登录</button>
            </form>
        </div>

        <!-- Main View -->
        <div id="mainView" class="flex-1 flex flex-col hidden overflow-hidden">
            <!-- Tabs -->
            <div class="tabs" role="tablist" aria-label="Bookmark actions">
                <button id="tabSave" class="tab active" role="tab" aria-selected="true" aria-controls="panelSave" data-i18n="tabSave">保存书签</button>
                <button id="tabSearch" class="tab" role="tab" aria-selected="false" aria-controls="panelSearch" data-i18n="tabSearch">搜索书签</button>
            </div>

            <!-- Content Area -->
            <div class="view-container">
                <!-- Save Panel -->
                <div id="panelSave" class="scrollable-content" role="tabpanel" aria-labelledby="tabSave" tabindex="0">
                    <form id="saveForm">
                        <div class="form-group">
<label class="label" for="folderSelectTrigger" data-i18n="selectFolder">选择文件夹</label>
                            <input type="hidden" id="folderSelect">
                            <div class="custom-select-wrapper">
                            <button id="folderSelectTrigger" class="select-trigger" type="button" aria-haspopup="tree" aria-expanded="false" aria-controls="folderTreeContainer">
                                    <span data-i18n="selectFolderPlaceholder">选择文件夹...</span>
                            </button>
                                <div id="folderTreeContainer" class="custom-options hidden" role="tree" aria-label="选择文件夹"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="label" for="bookmarkTitle" data-i18n="title">标题</label>
                            <input type="text" id="bookmarkTitle" placeholder="输入书签标题"
                                data-i18n-placeholder="titlePlaceholder">
                        </div>
                        <div class="form-group">
<label class="label" for="bookmarkUrl" data-i18n="url">网址</label>
                            <input type="url" id="bookmarkUrl" autocomplete="url" required>
                        </div>
                        <div class="form-group">
                            <label class="label" for="bookmarkDescription" data-i18n="desc">描述</label>
                            <textarea id="bookmarkDescription" rows="2" placeholder="输入书签描述 (可选)"
                                data-i18n-placeholder="descPlaceholder"></textarea>
                        </div>
                        <div id="saveMessage" class="status-msg hidden" role="status" aria-live="polite"></div>
                        <div id="syncMessage" class="status-msg hidden" role="status" aria-live="polite"></div>
                        <section id="pendingSavesPanel" class="pending-saves hidden" aria-labelledby="pendingSavesTitle">
                            <h3 id="pendingSavesTitle" data-i18n="pendingSavesTitle">待同步书签</h3>
                            <div id="pendingSavesList" class="pending-saves-list"></div>
                        </section>
                        <button id="retryPendingSavesBtn" type="button" class="btn-secondary hidden" data-i18n="retryPendingSaves">立即重试待同步书签</button>
                        <button type="submit" class="btn-primary" style="margin-top: 8px;">
                            <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M5 13l4 4L19 7">
                                </path>
                            </svg>
                            <span data-i18n="saveToBookmarks">保存到书签</span>
                        </button>
                    </form>
                </div>

                <!-- Search Panel -->
                <div id="panelSearch" class="scrollable-content hidden" role="tabpanel" aria-labelledby="tabSearch" tabindex="0">
                    <div class="search-box">
                        <div class="search-icon">
                            <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <label class="sr-only" for="searchInput" data-i18n="searchPlaceholder">输入关键词搜索...</label>
                        <input type="text" id="searchInput" class="search-input" placeholder="输入关键词搜索..."
                            data-i18n-placeholder="searchPlaceholder" autocomplete="off">
                    </div>
                    <div id="searchResults" style="flex: 1; overflow-y: auto;" role="region" aria-live="polite" aria-label="搜索结果">
                        <div style="text-align: center; color: var(--text-dim); padding: 40px 0;">
                            <p style="font-size: 13px;" data-i18n="startSearch">开始输入以搜索书签</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
