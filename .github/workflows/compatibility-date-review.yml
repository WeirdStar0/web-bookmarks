name: Compatibility date review

on:
  schedule:
    - cron: '17 8 10 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - wrangler.toml
      - scripts/check_compatibility_date.js
      - .github/workflows/compatibility-date-review.yml

permissions:
  contents: read

concurrency:
  group: compatibility-date-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Check compatibility date freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check compatibility date freshness
        run: node scripts/check_compatibility_date.js --max-age-days 90
