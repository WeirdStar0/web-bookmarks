name = "web-bookmarks"
compatibility_date = "2026-09-10"
main = "src/index.ts"

[observability]
enabled = true
# Wrangler 4.130.0 accepts this setting. Keep it enabled before restoring
# invocation logs or traces so request query strings are redacted at ingestion.
redact_query_string = true

[observability.logs]
enabled = true
# Keep invocation logs disabled in this toolchain-only change. They can be
# restored separately after CI confirms the upgraded Wrangler parses redaction.
invocation_logs = false
head_sampling_rate = 1

[observability.traces]
# Keep traces disabled until the toolchain upgrade is independently verified.
enabled = false

# 环境变量 - 在 Cloudflare Dashboard 中配置这些变量
# SECRET_KEY 是生产环境强制项（非 localhost 部署缺少它时请求会失败关闭）：
# npx wrangler secret put SECRET_KEY
[vars]
ALLOWED_EXTENSION_ORIGINS = "chrome-extension://ohebclnkjaeaklaajjllncngkmjkknao"
# SESSION_MAX_AGE = "604800"  # 7天,可选
# RATE_LIMIT_MAX = "100"      # 速率限制,可选
# RATE_LIMIT_WINDOW = "60"    # 时间窗口(秒),可选

[[d1_databases]]
binding = "DB"
database_name = "bookmarks-db"
database_id = "56ba610f-f5f9-4771-8ac5-957d89fce6a4"

# Required for production deployment. Create the namespace once with:
# npx wrangler kv namespace create RATE_LIMIT_KV
# The active binding below must contain the real namespace id.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "23d93f8a3f6c42b9a8d0a5270728c0b9"
