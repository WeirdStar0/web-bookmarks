name = "web-bookmarks"
compatibility_date = "2026-09-10"
main = "src/index.ts"

[observability]
enabled = true

[observability.logs]
enabled = true
# The repository currently locks Wrangler 4.56.0, which does not understand
# observability.redact_query_string. Keep invocation logs off so search query
# strings cannot be persisted in request URLs. Custom console logs remain on.
invocation_logs = false
head_sampling_rate = 1

[observability.traces]
# Traces can also contain request URLs. Re-enable only after Wrangler is upgraded
# to a release that accepts observability.redact_query_string and CI confirms it.
enabled = false

# 环境变量 - 在 Cloudflare Dashboard 中配置这些变量
# SECRET_KEY 是生产环境强制项（非 localhost 部署缺少它时请求会失败关闭）：
# npx wrangler secret put SECRET_KEY
[vars]
ALLOWED_EXTENSION_ORIGINS = "chrome-extension://ohebclnkjaeaklaajjllncngkmjkknao"
# SESSION_MAX_AGE = "604800"  # 7天,可选
# RATE_LIMIT_MAX = "100"      # 速率限制,可选
# RATE_LIMIT_WINDOW = "60"    # 时间窗口(秒),可选

[[d1_databases]]
binding = "DB"
database_name = "bookmarks-db"
database_id = "56ba610f-f5f9-4771-8ac5-957d89fce6a4"

# Required for production deployment. Create the namespace once with:
# npx wrangler kv namespace create RATE_LIMIT_KV
# The active binding below must contain the real namespace id.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "23d93f8a3f6c42b9a8d0a5270728c0b9"
